name: 2. 🕒 Scrape Races Daily

on:
  workflow_dispatch:
    inputs:
      scrape_type:
        description: "Which scrape is this?"
        required: true
        default: "manual"
        type: choice
        options:
          - morning
          - evening
          - manual

permissions:
  actions: write
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create BigQuery credentials file
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > key.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run ScrapeFromSpine.py
        run: python "2. Daily/2. ScrapeFromSpine.py"

      - name: Trigger Telegram alert
        if: ${{ success() && github.event.inputs.scrape_type != 'manual' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 4_telegram_alerts.yml \
            --ref main \
            -f alert_type=${{ github.event.inputs.scrape_type }}
