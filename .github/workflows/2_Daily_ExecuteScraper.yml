name: 2. 🕒 Scrape Races Daily

on:
  schedule:
    - cron: "0 3 * * *"
      timezone: "Europe/London"

  workflow_run:
    workflows:
      - "3. 🕒 Update Race Spine (Postrace @ 9pm)"
    types:
      - completed

  workflow_dispatch:

jobs:
  scrape:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create BigQuery credentials file
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > key.json
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Run ScrapeFromSpine.py
        run: python "2. Daily/2. ScrapeFromSpine.py"
