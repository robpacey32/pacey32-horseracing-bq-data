name: "4. 🕒 Telegram Horse Alerts"

on:
  workflow_dispatch:
    inputs:
      alert_type:
        description: "Which alert to send"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening

jobs:
  telegram-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Set alert type
        run: |
          echo "ALERT_TYPE=${{ github.event.inputs.alert_type }}" >> $GITHUB_ENV

      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_TYPE: ${{ env.ALERT_TYPE }}
        run: python Alerts/send_telegram_alerts.py
