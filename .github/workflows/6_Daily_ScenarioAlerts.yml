name: "6. Personalised Scenario Alerts"

on:
  workflow_dispatch:
    inputs:
      alert_type:
        description: "Which personalised alerts?"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - evening

      mode:
        description: "Preview, or write records and send messages?"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - send

permissions:
  contents: read

concurrency:
  group: personalised-scenario-alerts
  cancel-in-progress: false

jobs:
  scenario-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: app

    env:
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Show Google service account email
        run: |
          node -e 'console.log("Service account:", JSON.parse(process.env.GOOGLE_APPLICATION_CREDENTIALS_JSON).client_email)'

      - name: Check script syntax
        run: |
          node --check scripts/generate-scenario-selections.mjs
          node --check scripts/generate-scenario-results.mjs
          node --check scripts/send-scenario-alerts.mjs

      - name: Preview morning selections
        if: inputs.alert_type == 'morning' && inputs.mode == 'preview'
        run: node scripts/generate-scenario-selections.mjs --all-accounts

      - name: Preview evening results
        if: inputs.alert_type == 'evening' && inputs.mode == 'preview'
        run: node scripts/generate-scenario-results.mjs --all-accounts

      - name: Preview queued morning messages
        if: inputs.alert_type == 'morning' && inputs.mode == 'preview'
        run: node scripts/send-scenario-alerts.mjs --all-accounts --type morning

      - name: Preview queued evening messages
        if: inputs.alert_type == 'evening' && inputs.mode == 'preview'
        run: node scripts/send-scenario-alerts.mjs --all-accounts --type evening

      - name: Generate morning queue
        if: inputs.alert_type == 'morning' && inputs.mode == 'send'
        run: node scripts/generate-scenario-selections.mjs --all-accounts --morning --write

      - name: Generate evening queue
        if: inputs.alert_type == 'evening' && inputs.mode == 'send'
        run: node scripts/generate-scenario-results.mjs --all-accounts --write

      - name: Send morning messages
        if: inputs.alert_type == 'morning' && inputs.mode == 'send'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/send-scenario-alerts.mjs --all-accounts --type morning --send

      - name: Send evening messages
        if: inputs.alert_type == 'evening' && inputs.mode == 'send'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/send-scenario-alerts.mjs --all-accounts --type evening --send
